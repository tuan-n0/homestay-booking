# Dịch vụ phụ trợ cho môi trường phát triển: chạy `docker compose up -d`
#   MinIO   : API localhost:9000, giao diện http://localhost:9001 (minioadmin / minioadmin) — lưu ảnh phòng
#   Mailpit : SMTP localhost:1025, hộp thư http://localhost:8025 — xem email hệ thống gửi đi
# Cơ sở dữ liệu dùng PostgreSQL 15 cài trực tiếp trên máy (localhost:5432, database homestay_db).
services:
  minio:
    # Image chính thức minio/minio đã ngừng phát hành trên Docker Hub; dùng bản đóng gói của Bitnami
    image: bitnamilegacy/minio:latest
    container_name: homestay-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: homestay-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  miniodata:
