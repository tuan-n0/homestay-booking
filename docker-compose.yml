# Hạ tầng cho môi trường phát triển: chạy `docker compose up -d`
#   PostgreSQL : localhost:5433 (5432 để dành cho PostgreSQL cài sẵn trên máy)
#   MinIO      : API localhost:9000, giao diện http://localhost:9001 (minioadmin / minioadmin)
#   Mailpit    : SMTP localhost:1025, hộp thư http://localhost:8025
services:
  postgres:
    image: postgres:15-alpine
    container_name: homestay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homestay_db
      POSTGRES_USER: homestay
      POSTGRES_PASSWORD: homestay
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    # Image chính thức minio/minio đã ngừng phát hành trên Docker Hub; dùng bản đóng gói của Bitnami
    image: bitnamilegacy/minio:latest
    container_name: homestay-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: homestay-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
